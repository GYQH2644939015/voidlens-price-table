name: price-table

# 每天一次，抓 wm 全量价目表（物品表里的几千条）并提交回仓库。
#
# 为什么是每天：全量 3893 条 ≈ 4000–5800 次请求（3 请求/秒）≈ 25–32 分钟，
# 一天一次对 wm 的压力是 0.05 请求/秒；每小时一次就变成 1.4 请求/秒，没必要。
#
# 时间：12:07 UTC = 20:07 北京时间（晚场开打前刚好刷完）。
# --workers 24：GitHub runner 到 wm 的往返约 8–10 秒，8 个线程只能跑到 0.6 条/秒
# （实测 35 分钟才抓 1350 条）；24 个线程才能把 3 请求/秒的桶喂满，约 25–35 分钟跑完。
# public 仓库的 Actions 分钟数不限；private 只有 2000 分钟/月，这个任务一天一次也够，
# 但仍然是 public 更省心。

on:
  schedule:
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: '抓取范围（full=全部 3893 条；prime=Prime+安魂+星 769 条）'
        required: false
        default: 'full'
        type: choice
        options: ['full', 'prime']
  push:
    paths-ignore:
      - 'table_v1.json.gz'
      - 'README.md'
      - '.github/**'          # 只改 workflow 不触发跑（想试就手动 Run workflow）

concurrency:
  group: price-table
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # 云端任务的总开关：仓库 Settings → Secrets and variables → Actions → Variables
    #   新增 TABLE_OFF = true  →  整条定时任务跳过（不抓取、不提交，Actions 里显示 skipped）
    #   删掉这个变量 / 设成 false  →  恢复每天跑（默认就是跑）
    # 说明：变量不存在时表达式为 null，null != 'true' 成立，所以默认是「开」。
    if: vars.TABLE_OFF != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90          # 全量要 25–35 分钟，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: pip install --quiet -r requirements.txt

      - name: build table
        env:
          # 抓取范围的三处来源，优先级从上到下：
          #   1. 手动 Run workflow 时选的 scope
          #   2. 仓库变量 TABLE_SCOPE（prime=769 条 4–5 分钟 / full=3893 条 25–35 分钟）
          #   3. 兜底 full
          SCOPE: ${{ github.event.inputs.scope || vars.TABLE_SCOPE || 'full' }}
        run: python vl_publish.py --scope "$SCOPE" --out table_v1.json.gz --rate 3 --workers 24

      - name: check table
        run: python check_table.py table_v1.json.gz

      - name: commit
        run: |
          git config user.name  "voidlens-price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add table_v1.json.gz
          if git diff --staged --quiet; then
            echo "表内容没变，跳过提交"
            exit 0
          fi
          git commit -m "table $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::三次都推不上去，检查分支保护或权限"
          exit 1
