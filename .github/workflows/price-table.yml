name: price-table

# 每小时一次，抓「热区」价目表：Prime 759 + 安魂 mod 8 + 阿耶檀识青蓝星/琥珀星 2 = 769 条。
#
# 为什么是 769 条：这几乎就是开核桃时真正会看到的东西（奖励卡里能出的 Prime 部件、
# 安魂 mod、两种阿耶檀识星）。全量 3893 条一天只能跑一次（要 25–35 分钟），
# 而这 769 条 5 分钟就够，可以每小时来一遍。
#
# 想临时抓全量：Actions → price-table → Run workflow → scope 选 full，
# 或者在仓库变量里设 TABLE_SCOPE=full（详见 README）。
# --workers 24：GitHub runner 到 wm 的往返约 8–10 秒，8 个线程只能跑到 0.6 条/秒
# （实测 35 分钟才抓 1350 条）；24 个线程才能把 3 请求/秒的桶喂满，约 25–35 分钟跑完。
# public 仓库的 Actions 分钟数不限；private 只有 2000 分钟/月，这个任务一天一次也够，
# 但仍然是 public 更省心。

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: '抓取范围（full=全部 3893 条；prime=Prime+安魂+星 769 条）'
        required: false
        default: 'prime'
        type: choice
        options: ['prime', 'full']
  push:
    paths-ignore:
      - 'table_v1.json.gz'
      - 'README.md'
      - '.github/**'          # 只改 workflow 不触发跑（想试就手动 Run workflow）

concurrency:
  group: price-table
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # 云端任务的总开关：仓库 Settings → Secrets and variables → Actions → Variables
    #   新增 TABLE_OFF = true  →  整条定时任务跳过（不抓取、不提交，Actions 里显示 skipped）
    #   删掉这个变量 / 设成 false  →  恢复每天跑（默认就是跑）
    # 说明：变量不存在时表达式为 null，null != 'true' 成立，所以默认是「开」。
    if: vars.TABLE_OFF != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30          # 769 条约 5 分钟，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: pip install --quiet -r requirements.txt

      - name: build table
        env:
          # 抓取范围的三处来源，优先级从上到下：
          #   1. 手动 Run workflow 时选的 scope
          #   2. 仓库变量 TABLE_SCOPE（prime=769 条 5 分钟 / full=3893 条 25–35 分钟）
          #   3. 兜底 prime
          SCOPE: ${{ github.event.inputs.scope || vars.TABLE_SCOPE || 'prime' }}
        run: python vl_publish.py --scope "$SCOPE" --out table_v1.json.gz --rate 3 --workers 24

      - name: check table
        run: python check_table.py table_v1.json.gz

      - name: commit
        run: |
          git config user.name  "voidlens-price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add table_v1.json.gz
          if git diff --staged --quiet; then
            echo "表内容没变，跳过提交"
            exit 0
          fi
          git commit -m "table $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::三次都推不上去，检查分支保护或权限"
          exit 1
