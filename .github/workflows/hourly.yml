name: hourly-price-table

# 每小时生成一次 wm 价目表并提交回仓库。
# public 仓库的 Actions 分钟数不限；private 只有 2000 分钟/月，撑不住每小时一跑。
#
# 注意：CDN 缓存由单独的 purge-cdn.yml 在每小时 :25 清理（不要在这里立刻 purge ——
# 那时 GitHub 自己的 raw CDN 还没更新，purge 反而会让 jsDelivr 缓存住旧的那份）。

on:
  schedule:
    - cron: '7 * * * *'        # 每小时第 7 分钟，避开整点排队
  workflow_dispatch:           # 手动补跑
  push:
    paths-ignore:
      - 'table_v1.json.gz'
      - 'README.md'

concurrency:
  group: price-table
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: pip install --quiet -r requirements.txt

      - name: build table
        run: python vl_publish.py --out table_v1.json.gz --rate 3 --workers 8

      - name: check table
        run: python check_table.py table_v1.json.gz

      - name: commit
        run: |
          git config user.name  "voidlens-price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add table_v1.json.gz
          if git diff --staged --quiet; then
            echo "表内容没变，跳过提交"
            exit 0
          fi
          git commit -m "table $(date -u +%FT%TZ)"
          # 抓取要 4-6 分钟，期间有人往 main 推过（比如改了文档）就会被拒：
          # rebase 到最新 main 再推，最多三次
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::三次都推不上去，检查分支保护或权限"
          exit 1
