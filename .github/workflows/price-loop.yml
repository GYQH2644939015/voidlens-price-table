# 价格表的「自动接力链」——不依赖 GitHub 的 schedule。
#
# 为什么要有这条：本仓库的 `schedule` 从未触发过（2026-11-11 12:02Z 建仓到 11-12 03:00Z，
# 三条 workflow 全部 0 条 schedule 运行记录；而 push / 手动都是秒级响应），cron 不可依赖。
#
# 机制：每一班跑完，用 GITHUB_TOKEN 派下一班 workflow_dispatch；下一班自己睡到下一个整点 :07 抓表。
# 依据：官方文档「用 GITHUB_TOKEN 执行任务时，由它触发的事件不产生新的运行，例外是
# workflow_dispatch 与 repository_dispatch」——所以这张表能自己叫醒自己。
#
# 单链保证：开跑先 prune（取消其它还在跑/排队的本 workflow 班次），收尾再 handoff；
# handoff 若发现还有别班在跑就跳过，永远不会分叉出第二条链。
#
# 代价：同一时间恒有一个 runner 在睡（公共仓库 Actions 分钟数不限）。
# 重启：改 LOOP_KICK 再 push 一次即可把链接上（链条断了也靠这一下接回）。
# 停掉：仓库变量 TABLE_OFF=true（与 price-table.yml 共用）。

name: price-loop

on:
  workflow_dispatch:
    inputs:
      phase:
        # now   = 立刻抓一次就结束（给国内云函数闹钟用，不占 runner 睡觉）
        # chain = 等到下一个整点 :07 再抓，然后派下一班（接力链，7×24 兜底）
        # stop  = 只清理别的班次、自己不发布也不续班（停链条用）
        description: 'now / chain / stop'
        required: false
        default: 'now'
  push:
    paths:
      - 'LOOP_KICK'

permissions:
  contents: write
  actions: write          # 派下一班 / 取消重复班次

concurrency:
  # 独立分组：接力链自己有单链保证（开跑 prune + 收尾 handoff），
  # 不需要跟 price-table.yml 抢同一个组，否则一条卡住的旧班次会把整条链堵住
  # （2026-11-11 19:11 实测：旧班次占着 price-table 组，新班次一直 pending）。
  group: price-chain
  cancel-in-progress: false

jobs:
  loop:
    if: vars.TABLE_OFF != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 要查 table 上次提交时间，浅克隆查不到

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: pip install --quiet -r requirements.txt

      - name: 只留本班（取消重复的链）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python loop_ctl.py prune

      - name: 等到下一个整点 :07
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.phase == 'chain'
        run: python loop_ctl.py wait

      - name: build table
        if: github.event.inputs.phase != 'stop'
        env:
          SCOPE: ${{ vars.TABLE_SCOPE || 'prime' }}
        run: python vl_publish.py --scope "$SCOPE" --out table_v1.json.gz --rate 3 --workers 24

      - name: check table
        if: github.event.inputs.phase != 'stop'
        run: python check_table.py table_v1.json.gz

      - name: commit（默认每 6 小时才提交一次，其余时间只更新 OSS）
        if: github.event.inputs.phase != 'stop'
        env:
          # 仓库提交节流：内容变了也不一定马上提交，降低「每小时一个 bot 提交」的噪音
          COMMIT_EVERY_H: ${{ vars.COMMIT_EVERY_H || '6' }}
        run: |
          git config user.name  "voidlens-price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add table_v1.json.gz
          if git diff --staged --quiet; then
            echo "表内容没变，跳过提交"
            exit 0
          fi
          LAST=$(git log -1 --format=%ct -- table_v1.json.gz 2>/dev/null || echo 0)
          NOW=$(date -u +%s)
          EVERY=$(( ${COMMIT_EVERY_H:-6} * 3600 ))
          if [ "${LAST:-0}" -gt 0 ] && [ $((NOW - LAST)) -lt "$EVERY" ]; then
            echo "距上次提交只过了 $(( (NOW - LAST) / 60 )) 分钟（阈值 ${COMMIT_EVERY_H}h），这次只更新 OSS，不提交"
            echo "::notice::仓库提交节流：表已更新，仓库稍后合并"
            exit 0
          fi
          git commit -m "table $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          git rebase --abort 2>/dev/null || true
          echo "::warning::仓库这份表没推上去（多半是并发 rebase 冲突），OSS 已经是最新的，下一班再来"
          exit 0

      - name: 上传到 OSS（国内分发源，没配就跳过）
        # 即使 commit 失败也传：客户端首选 OSS，仓库只是备份
        if: always() && github.event.inputs.phase != 'stop'
        continue-on-error: true
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_KEY: ${{ vars.OSS_KEY }}
        run: |
          pip install --quiet oss2
          python upload_oss.py table_v1.json.gz

      - name: 把下一班排上（now 不续班；其余情况失败也照排，链条不断）
        if: always() && github.event.inputs.phase != 'now' && github.event.inputs.phase != 'stop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python loop_ctl.py handoff
