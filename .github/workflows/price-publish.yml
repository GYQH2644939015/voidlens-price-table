# 价目表发布 · 一次性班次（无 sleep、无接力、无 schedule）
#
# 设计原则：这个 workflow 只做一件事——被抓起来就抓一次表、传一次 OSS、提交一次仓库，
# 然后结束。它不负责"下一次什么时候跑"，那是触发器的事（阿里云 FC 定时器 / 本机计划任务
# / 手动 Run），见 云端同步方案_v1.0_国内优先.md 第 4.2 节。
#
# 历史：原来的 price-loop.yml 用 workflow_dispatch 自己派下一班、自己 sleep 到整点，
# 等于 24 小时占一个 runner 在睡觉——既像滥用，又是单链（prune 误杀、startup_failure 都遇到过）。
# 那份文件保留归档、不再启用；本文件与它互不依赖。
#
# 触发：
#   * 外部定时器 POST /actions/workflows/price-publish.yml/dispatches  {"ref":"main"}
#   * 手动 Run workflow（可填 scope=full、force=true）
#   * push 本仓库的 LOOP_KICK（急事踢一脚）
#
# 防重：默认 40 分钟内已出过表就跳过（双触发器同时叫也不会重复发布），force=true 可绕过。

name: price-publish

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'prime（769 条，约 5 分钟）/ full（3893 条，约 25 分钟）'
        required: false
        default: 'prime'
      force:
        description: 'true = 忽略「40 分钟内已发布」的防重检查'
        required: false
        default: 'false'
      via:
        # 双触发器并行时用来分辨"这一班是谁叫的"：cronjob / cloudflare / fc / manual
        # 只写进 publish_status.json，不参与任何判断；某个触发器静默死掉时一眼可见
        description: '叫醒来源（cronjob / cloudflare / fc / manual）'
        required: false
        default: ''
  push:
    paths:
      - 'LOOP_KICK'

permissions:
  contents: write          # 只为了提交 table_v1.json.gz 这份备份镜像

concurrency:
  group: price-publish
  cancel-in-progress: false

jobs:
  publish:
    # 停用开关：仓库变量 PUBLISH_OFF=true。
    # 注意别沿用旧名字 TABLE_OFF —— 这个仓库里 TABLE_OFF 现在是 'true'（当初停接力链时设的），
    # 当前 token 没有 Variables 权限删不掉它，所以换一个新名字，行为才可控。
    if: vars.PUBLISH_OFF != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 要查 table 上次提交时间

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依赖
        run: pip install --quiet -r requirements.txt

      - name: 防重（40 分钟内已出过表就跳过）
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          # 与上传步骤保持一致（变量里那个桶名建不出来，见上传步骤的注释）
          OSS_BUCKET: voidlens-table-2644939015
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_KEY: voidlens/table_v1.json.gz
        run: |
          set -u
          if [ "${FORCE}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::force=true，跳过防重"
            exit 0
          fi
          KEY="${OSS_KEY:-voidlens/table_v1.json.gz}"
          LAST=0
          LM=""
          if [ -n "${OSS_BUCKET:-}" ] && [ -n "${OSS_ENDPOINT:-}" ]; then
            URL=$(printf '%s' "$OSS_ENDPOINT" | sed "s#://#://${OSS_BUCKET}.#")"/${KEY}"
            LM=$(curl -sI --max-time 10 "$URL" | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="last-modified"{print $2}')
            echo "OSS 表的 Last-Modified：${LM:-（拿不到）}"
            if [ -n "${LM:-}" ]; then LAST=$(date -d "$LM" +%s 2>/dev/null || echo 0); fi
          fi
          if [ "${LAST}" -eq 0 ]; then
            LAST=$(git log -1 --format=%ct -- table_v1.json.gz 2>/dev/null || echo 0)
            echo "退回仓库提交时间作为参考"
          fi
          NOW=$(date +%s)
          AGE=$(( NOW - LAST ))
          echo "上次发布距今 ${AGE}s（约 $(( AGE / 60 )) 分钟）"
          if [ "${LAST}" -gt 0 ] && [ "${AGE}" -lt 2400 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::40 分钟内已经出过表，本班跳过（要强制就填 force=true）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓表（769 条约 5 分钟）
        id: build
        if: steps.gate.outputs.skip != 'true'
        env:
          # 2.5 req/s 而不是 3.0：实测 797 请求 / 266 秒就是 3.0/s 顶格，留一点余量防 429
          SCOPE: ${{ github.event.inputs.scope || vars.TABLE_SCOPE || 'prime' }}
        run: |
          python vl_publish.py --scope "$SCOPE" --out table_v1.json.gz --rate 2.5 --workers 16

      - name: 自检（坏表不提交、不上传）
        id: check
        if: steps.gate.outputs.skip != 'true'
        run: python check_table.py table_v1.json.gz

      - name: 写发布状态（失败也写，客户端/巡检靠它定位断在哪一段）
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          PUBLISH_ERROR: ${{ steps.build.outcome != 'success' && 'build-failed' || '' }}
          TRIGGER_VIA: ${{ github.event.inputs.via || '' }}
        run: |
          python publish_status.py table_v1.json.gz publish_status.json || true
          cat publish_status.json || true

      - name: 上传到 OSS（国内分发源）
        # 只有自检通过的表才上传：坏表绝不能用一次 PUT 顶掉云端那份好的
        id: oss
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          # 仓库变量里的那个名字（voidlens-price-2644939015）已被别的账号占用，建不出来（409 BucketAlreadyExists），
          # 所以这里写死真正建成的桶；变量只当历史遗留，不再读取。
          OSS_BUCKET: voidlens-table-2644939015
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_KEY: voidlens/table_v1.json.gz
          OSS_VERIFY: '1'
          CHECK: ${{ steps.check.outcome }}
        run: |
          pip install --quiet oss2
          KEY="${OSS_KEY:-voidlens/table_v1.json.gz}"
          if [ "${CHECK}" = "success" ] && [ -f table_v1.json.gz ]; then
            python upload_oss.py table_v1.json.gz
          else
            echo "自检未通过（${CHECK}），本次只传发布状态，不动云端那张表"
          fi
          if [ -f publish_status.json ]; then
            # status 放同一个目录，缓存 30 秒
            OSS_KEY="${KEY%/*}/publish_status.json" OSS_CACHE="max-age=30" \
              python upload_oss.py publish_status.json
          fi
          cat oss_result.json 2>/dev/null || true

      - name: 提交仓库副本（默认 6 小时才提交一次，降低 bot 提交噪音）
        if: steps.check.outcome == 'success'
        env:
          COMMIT_EVERY_H: ${{ vars.COMMIT_EVERY_H || '6' }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          git config user.name  "voidlens-price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add table_v1.json.gz
          if git diff --staged --quiet; then
            echo "表内容没变，跳过提交"
            exit 0
          fi
          LAST=$(git log -1 --format=%ct -- table_v1.json.gz 2>/dev/null || echo 0)
          NOW=$(date -u +%s)
          EVERY=$(( ${COMMIT_EVERY_H:-6} * 3600 ))
          # 以"OSS 到底传没传成功"为准，而不是"有没有配 OSS"——配了但桶坏了的时候，
          # 两边都以为对方会分发，结果谁都没更新（05:39 那一班就是这么空转的）。
          OSS_OK=$(grep -c '"ok":true' oss_result.json 2>/dev/null || echo 0)
          if [ "${OSS_OK:-0}" -eq 0 ]; then
            EVERY=0
            echo "OSS 没传成功 → 仓库就是唯一分发源，本班直接提交"
          fi
          if [ "${LAST:-0}" -gt 0 ] && [ $((NOW - LAST)) -lt "$EVERY" ]; then
            echo "距上次提交 $(( (NOW - LAST) / 60 )) 分钟（阈值 ${COMMIT_EVERY_H}h），本班只更新 OSS"
            exit 0
          fi
          git commit -m "table $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          git rebase --abort 2>/dev/null || true
          echo "::warning::仓库副本没推上去（并发 rebase 冲突），OSS 那张表已经是最新的"

      - name: 让 jsDelivr 立刻生效（免费 purge，不需要账号）
        # 只清 cdn.jsdelivr.net 的缓存；fastly.jsdelivr.net 是另一套缓存，清不掉、会滞后最多 12 h
        # 仓库副本没提交（6 h 节流）时这一步没有意义，但也就多花 1 秒，不 gate
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: |
          curl -s --max-time 20             "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/table_v1.json.gz"             | head -c 400 || true
          echo

      - name: 小结
        if: always()
        run: |
          echo "### 价目表班次" >> "$GITHUB_STEP_SUMMARY"
          echo "- 防重跳过：${{ steps.gate.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 抓取结果：${{ steps.build.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f publish_status.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat publish_status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
