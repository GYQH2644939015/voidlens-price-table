name: purge-cdn

# 每天一次，在价目表生成之后（12:07 UTC）的 12:25 UTC 清 jsDelivr 缓存。
#
# 为什么不能生成完立刻 purge：GitHub 自己的 raw.githubusercontent.com 有 3–10 分钟
# CDN 缓存，立刻 purge 会让 jsDelivr 回源拿到**旧的那一份**，然后缓存住（最长 12 小时）。
# 等到 :25，raw 那边早就换新了，purge 一次就能让 CDN 拿到当天的正确表。

on:
  schedule:
    - cron: '25 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: purge
        run: |
          set -x
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/table_v1.json.gz"
